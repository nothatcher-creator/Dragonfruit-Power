name: Build Vehicle Forge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Pick the mod jar
        run: |
          mkdir -p release
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" release/vehicle-forge.jar
          ls -la release

      - name: Upload JAR (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-forge-jar
          path: release/vehicle-forge.jar

      # Direct .jar download for phones: a GitHub Release with the jar attached.
      # Stable link: https://github.com/<owner>/<repo>/releases (tags vf-build-N)
      - name: Publish release with the .jar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/vehicle-forge'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vf-build-${{ github.run_number }}
          name: Vehicle Forge build ${{ github.run_number }}
          body: |
            Tap **vehicle-forge.jar** below to download it, then put it in your mods folder (Minecraft 1.20.1, Fabric).
            Also needs Fabric API for 1.20.1 (0.92.x).
          files: release/vehicle-forge.jar
          make_latest: false
